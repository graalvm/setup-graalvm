name: Update Dependabot dist/

on:
  workflow_run:
    workflows:
      - Check Transpiled JavaScript
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  update-dist:
    name: Commit regenerated dist/
    if: >-
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' && github.event.workflow_run.head_repository.full_name
      == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dependabot commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download regenerated dist/
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Commit regenerated dist/
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          rm -rf dist/
          mv "${RUNNER_TEMP}/dist" dist/

          git add --all -- dist/
          if git diff --cached --quiet; then
            echo "dist/ is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "Regenerate dist/ files."
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
